<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f8f6f0">
  <meta name="description" content="2048">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="2048">
  <title>2048</title>
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="icon-undo" viewBox="0 0 24 24"><path d="m8 5-5 5 5 5M3 10h10a6 6 0 0 1 0 12" transform="translate(0 -2)"/></symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.3 5.7"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m9 5 10 7-10 7Z"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></symbol>
    <symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M8 3h8v7a4 4 0 0 1-8 0ZM8 5H4v3a4 4 0 0 0 4 4M16 5h4v3a4 4 0 0 1-4 4M12 14v6M8 21h8"/></symbol>
  </defs></svg>
  <main class="game" aria-label="2048">
    <header class="scores">
      <div class="current-score"><span class="sr-only">スコア</span><strong id="score">0</strong></div>
      <div class="best-score"><svg aria-hidden="true"><use href="#icon-trophy"/></svg><span class="sr-only">ベスト</span><strong id="best">0</strong></div>
    </header>
    <div class="board-shell">
      <div class="board" id="board" role="group" tabindex="0" aria-label="上下左右にスワイプ、または矢印キーで操作">
        <div class="grid" aria-hidden="true"></div>
        <div class="tiles" id="tiles" aria-hidden="true"></div>
        <div class="sr-only" id="accessible-board"></div>
      </div>
      <div class="board-overlay" id="result" hidden>
        <h1 id="result-title"></h1>
        <div class="result-actions">
          <button class="primary" id="continue-button" aria-label="続ける"><svg aria-hidden="true"><use href="#icon-play"/></svg></button>
          <button class="primary" id="retry-button" aria-label="新しいゲーム"><svg aria-hidden="true"><use href="#icon-reset"/></svg></button>
          <button id="result-undo" aria-label="1手戻す"><svg aria-hidden="true"><use href="#icon-undo"/></svg></button>
        </div>
      </div>
    </div>
    <footer class="actions">
      <button id="undo-button" aria-label="1手戻す" disabled><svg aria-hidden="true"><use href="#icon-undo"/></svg></button>
      <button id="new-button" aria-label="はじめから"><svg aria-hidden="true"><use href="#icon-reset"/></svg></button>
      <span id="storage-warning" role="alert" hidden>保存不可</span>
    </footer>
    <div class="sr-only" id="announcement" aria-live="polite" aria-atomic="true"></div>
    <div class="sr-only" aria-label="方向ボタン"><button data-direction="up" aria-label="上に動かす">↑</button><button data-direction="left" aria-label="左に動かす">←</button><button data-direction="down" aria-label="下に動かす">↓</button><button data-direction="right" aria-label="右に動かす">→</button></div>
    <noscript>JavaScriptを有効にしてください。</noscript>
  </main>
  <dialog id="new-dialog" aria-labelledby="new-title">
    <h2 id="new-title">リセット？</h2>
    <div class="dialog-actions"><button id="cancel-new" aria-label="キャンセル"><svg aria-hidden="true"><use href="#icon-close"/></svg></button><button class="primary" id="confirm-new" aria-label="リセットする"><svg aria-hidden="true"><use href="#icon-check"/></svg></button></div>
  </dialog>
</body>
</html>
